services:
  - type: web
    name: intelligent-hospital-assistant
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run frontend/src/Home.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: STAFF_USERNAME
        value: admin
      - key: STAFF_PASSWORD
        sync: false
